name: Render Math Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
  push:
    branches:
      - main
    paths:
      - "main.py"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Render videos
        run: |
          python main.py

      - name: Check videos
        run: |
          set -e

          test "$(find output -maxdepth 1 -name '*.mp4' -type f | wc -l)" -eq 3

          for f in output/*.mp4
          do
            echo "Checking $f"
            test -s "$f"

            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,duration \
              -of default=noprint_wrappers=1 "$f"
          done

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: math-youtube-videos
          path: output/*.mp4
          if-no-files-found: error
